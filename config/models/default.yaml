# Role aliases → { provider instance, model, generation settings }.
#
# An alias selects both a provider INSTANCE and a model.
# This allows the same logical role to move between:
#   - local CPU inference
#   - local GPU inference
#   - remote GPU inference
#   - Hugging Face inference
# without changing agent configuration elsewhere.
#
# IMPORTANT:
# Capability is determined by runtime probes, not assumptions in this file.
#
# HOST SELECTION:
# Under ROUTING_POLICY=gpu-preferred a role alias runs on the RunPod GPU when
# its `gpu_<role>` twin below is reachable and serving the named model. Local
# Ollama is the fallback, never the silent default: when the pod is stopped,
# unreachable, or missing the model, the run reports which of those it was.
#
# Current measured capabilities:
#
#   huihui_ai/qwen3-abliterated:8b
#     - tool calling VERIFIED
#     - structured tool channel VERIFIED
#     - streaming VERIFIED
#     - default chat and coding model
#
#   qwen3:8b
#     - tool calling VERIFIED
#     - structured tool channel VERIFIED
#     - multi-turn agent loop VERIFIED
#     - planner, reasoner and supporting autonomous roles
#
#   qwen2.5-coder
#     - tool calling VERIFIED through text-json
#     - good single-turn coding/completion
#     - unreliable for sustained multi-turn tool loops
#
#   phi4-mini
#     - advertises tool support
#     - malformed tool calls observed
#     - advisory only
#
#   phi3:mini
#     - no usable tool support
#     - advisory only
#
# Tool-driven roles MUST be rejected by the agent runtime unless their selected
# provider/model combination passes the required capability probe.
#
# Advisory models may analyze supplied context but MUST NOT be allowed to execute
# filesystem, shell, database, browser, network, or mutation tools.

models:

  # ---------------------------------------------------------------------------
  # PRIMARY AUTONOMOUS AGENT
  # ---------------------------------------------------------------------------
  #
  # Default model for real multi-turn agent work.
  #
  # This role should:
  #   1. understand the user's goal
  #   2. inspect relevant context
  #   3. make a short internal plan
  #   4. use tools
  #   5. observe results
  #   6. continue until the task is complete
  #   7. verify its work
  #   8. answer the user's actual question
  #
  # Do not replace this with an advisory-only model.
  agent:
    provider: local_ollama
    model: qwen3:8b
    temperature: 0.15

  # ---------------------------------------------------------------------------
  # PLANNER / REASONER
  # ---------------------------------------------------------------------------
  #
  # Used before complex execution and when the executor encounters ambiguity,
  # unexpected results, test failures, or architectural decisions.
  #
  # Slightly higher temperature allows consideration of multiple plausible
  # approaches without making the output excessively random.
  planner:
    provider: local_ollama
    model: qwen3:8b
    temperature: 0.25

  reasoner:
    provider: local_ollama
    model: qwen3:8b
    temperature: 0.25

  # ---------------------------------------------------------------------------
  # CODING EXECUTOR
  # ---------------------------------------------------------------------------
  #
  # Handles tool-driven repository work:
  #   - filesystem inspection
  #   - code edits
  #   - tests
  #   - lint/typecheck
  #   - targeted debugging
  #
  # Keep temperature low. Coding execution should favor established repository
  # patterns over creative invention.
  coder:
    provider: local_ollama
    model: huihui_ai/qwen3-abliterated:8b
    temperature: 0.08

  # Explicit alias for tool-loop execution when the caller specifically needs
  # verified structured tool calls.
  structured_agent:
    provider: local_ollama
    model: qwen3:8b
    temperature: 0.05

  # ---------------------------------------------------------------------------
  # REVIEWER / CRITIC
  # ---------------------------------------------------------------------------
  #
  # Reviews work AFTER implementation.
  #
  # The reviewer should receive:
  #   - original task
  #   - relevant architecture/rules
  #   - changed files
  #   - git diff
  #   - test results
  #
  # A slightly different sampling profile from the coder helps reduce identical
  # reasoning paths during self-review.
  reviewer:
    provider: local_ollama
    model: qwen3:8b
    temperature: 0.22

  # ---------------------------------------------------------------------------
  # CHAT
  # ---------------------------------------------------------------------------
  #
  # Default conversational/completion role. This uses the same low-refusal
  # checkpoint as the coding executor, with a chat-oriented temperature.
  chat:
    provider: local_ollama
    model: huihui_ai/qwen3-abliterated:8b
    temperature: 0.2

  # ---------------------------------------------------------------------------
  # OPTIONAL LOW-REFUSAL QWEN CHAT MODEL
  # ---------------------------------------------------------------------------
  #
  # Community abliterated Qwen checkpoint. This alias changes model behavior,
  # not application authority: filesystem, shell, network and mutation access
  # still pass through the normal DACAIS permission and audit boundaries.
  #
  # Install it with: pnpm model:install:qwen-uncensored
  # The agent loop admits it only if the runtime tool-capability probe passes;
  # it remains usable for ordinary chat when tool calling is not verified.
  qwen_uncensored:
    provider: local_ollama
    model: huihui_ai/qwen3-abliterated:8b
    temperature: 0.2

  # ---------------------------------------------------------------------------
  # VISION / IMAGE UNDERSTANDING
  # ---------------------------------------------------------------------------
  #
  # The only aliases that can actually SEE an uploaded image. Every other model
  # in this file is text-only and receives, at most, a filename and a workspace
  # path.
  #
  # Used when a run has an image attachment: the agent can describe the picture,
  # locate subjects and anatomy within it, answer questions about it, and check
  # a generated edit against what was asked for.
  #
  #   qwen2.5vl:7b
  #     - image understanding VERIFIED on the L40S pod
  #     - tool calling NOT assumed; the runtime probe still decides
  #
  # Install with: ollama pull qwen2.5vl:7b
  vision:
    provider: local_ollama
    model: qwen2.5vl:7b
    temperature: 0.2

  # ---------------------------------------------------------------------------
  # FAST ADVISORY MODEL
  # ---------------------------------------------------------------------------
  #
  # Cheap classification, summarization, extraction, routing suggestions,
  # lightweight commentary.
  #
  # NO TOOL EXECUTION.
  fast:
    provider: local_ollama
    model: phi3:mini
    temperature: 0.25

  # ---------------------------------------------------------------------------
  # RESEARCH / SECOND-OPINION ADVISORY MODEL
  # ---------------------------------------------------------------------------
  #
  # Can inspect supplied results and produce analysis, but should never enter
  # the autonomous execution loop until a capability probe proves correct tool
  # calling.
  research:
    provider: local_ollama
    model: phi4-mini:latest
    temperature: 0.35

  # ---------------------------------------------------------------------------
  # OPENAI RESPONSES API — EXPLICIT PAID/CLOUD OPTION
  # ---------------------------------------------------------------------------
  # Additional selectable coding-loop path. The existing local coder alias
  # remains the default. Remote routing policy still applies.
  sol:
    provider: openai_sol
    model: gpt-5.6-sol
    temperature: 0.08

  # Explicit paid/cloud Claude option. The alias remains disabled until the
  # operator configures ANTHROPIC_MODEL; automatic routing never selects it.
  claude:
    provider: anthropic
    model: ${ANTHROPIC_MODEL}
    temperature: 0.15

  # ---------------------------------------------------------------------------
  # ECOSYSTEM / INVESTOR INTELLIGENCE
  # ---------------------------------------------------------------------------
  #
  # Theme extraction, semantic matching, opportunity analysis, mock diligence,
  # memo and content drafting. Advisory-class work: no tool authority is granted
  # on this path, so a verified tool-calling probe is not required.
  #
  # `intelligence` prefers the RunPod GPU instance. `intelligence_local` is the
  # named fallback, used when the pod is unreachable. The fallback is recorded
  # on the result rather than applied silently -- see
  # packages/providers/src/structured-generation.ts.
  intelligence:
    provider: remote_gpu_ollama
    model: ${RUNPOD_OLLAMA_MODEL}
    temperature: 0.2

  intelligence_local:
    provider: local_ollama
    model: qwen3:8b
    temperature: 0.2

  # ---------------------------------------------------------------------------
  # GPU TWINS
  # ---------------------------------------------------------------------------
  #
  # Each `gpu_<role>` alias is the RunPod counterpart of the local `<role>`
  # alias above. Under ROUTING_POLICY=gpu-preferred the provider registry
  # resolves `<role>` to `gpu_<role>` whenever the pod answers an inference
  # request AND already serves the model named here; otherwise the local alias
  # runs and the reason is reported on the run.
  #
  # The pairing is by NAME on purpose. Promoting by provider instance alone
  # would carry the local model name to the pod, which serves a different
  # (usually larger) checkpoint, and the request would fail at inference time.
  #
  # Keep the temperatures aligned with the local twin so moving hosts does not
  # silently change sampling behavior. These aliases stay individually
  # selectable, so a run can still be pinned to the GPU explicitly.
  gpu_agent:
    provider: remote_gpu_ollama
    model: qwen3:8b
    temperature: 0.15

  gpu_planner:
    provider: remote_gpu_ollama
    model: qwen3:8b
    temperature: 0.25

  gpu_reasoner:
    provider: remote_gpu_ollama
    model: qwen3:8b
    temperature: 0.25

  gpu_coder:
    provider: remote_gpu_ollama
    model: huihui_ai/qwen3-abliterated:8b
    temperature: 0.08

  gpu_structured_agent:
    provider: remote_gpu_ollama
    model: qwen3:8b
    temperature: 0.05

  gpu_reviewer:
    provider: remote_gpu_ollama
    model: qwen3:8b
    temperature: 0.22

  gpu_chat:
    provider: remote_gpu_ollama
    model: huihui_ai/qwen3-abliterated:8b
    temperature: 0.2

  gpu_qwen_uncensored:
    provider: remote_gpu_ollama
    model: huihui_ai/qwen3-abliterated:8b
    temperature: 0.2

  gpu_vision:
    provider: remote_gpu_ollama
    model: qwen2.5vl:7b
    temperature: 0.2

  # ---------------------------------------------------------------------------
  # HUGGING FACE ADVISORY / FALLBACK ROLES
  # ---------------------------------------------------------------------------
  #
  # These are advisory by default.
  #
  # They MUST NOT receive tool authority merely because the underlying model
  # family supports tools elsewhere. The configured provider adapter itself
  # must pass the project's capability contract.
  #
  # None of these need an explicit `enabled` flag: config loading disables every
  # alias whose provider instance is inactive, so HF_PROVIDER_ENABLED (plus a
  # token) is the single switch that decides whether they appear in the picker.

  hf_reasoner:
    provider: huggingface
    model: ${HF_DEFAULT_MODEL}
    temperature: 0.25

  hf_llama:
    provider: huggingface
    model: meta-llama/Llama-3.1-8B-Instruct
    temperature: 0.25

  hf_qwen3:
    provider: huggingface
    model: Qwen/Qwen3-8B
    temperature: 0.2

  hf_qwen3_coder:
    provider: huggingface
    model: Qwen/Qwen3-Coder-Next
    temperature: 0.1

  hf_deepseek:
    provider: huggingface
    model: deepseek-ai/DeepSeek-R1
    temperature: 0.15

  hf_gemma:
    provider: huggingface
    model: google/gemma-4-31B-it
    temperature: 0.25
